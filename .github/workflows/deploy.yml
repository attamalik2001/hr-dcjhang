name: Deploy DC Office Jhang HRMS to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize package.json for public npm registry & Install dependencies
        run: |
          node -e '
            const fs = require("fs");
            const pkg = {
              name: "hr-dcjhang",
              private: true,
              version: "1.0.0",
              type: "module",
              scripts: {
                dev: "vite --port=3000 --host=0.0.0.0",
                build: "vite build",
                preview: "vite preview"
              },
              dependencies: {
                "@supabase/supabase-js": "^2.45.0",
                "@tailwindcss/vite": "^4.0.0",
                "@vitejs/plugin-react": "^4.3.0",
                "lucide-react": "^0.460.0",
                "react": "^19.0.0",
                "react-dom": "^19.0.0",
                "tailwindcss": "^4.0.0",
                "vite": "^6.0.0"
              },
              devDependencies: {
                "@types/node": "^22.0.0",
                "@types/react": "^19.0.0",
                "@types/react-dom": "^19.0.0",
                "typescript": "^5.7.0"
              }
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          npm install --legacy-peer-deps

      - name: Build static production bundle for GitHub Pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://qjoflyaxwffwzoodehod.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqb2ZseWF4d2Zmd3pvb2RlaG9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4OTMwMzMsImV4cCI6MjExMDQ2OTAzM30.mT3aPGZW9rArT6tJLWIYBjzun-EhGhQTZARPw2nCLes' }}
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
